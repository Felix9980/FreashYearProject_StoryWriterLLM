<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>開創世界線 - 註冊專屬身分</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-slate-900 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-800">
        <h2 class="text-2xl font-bold mb-6 text-center text-teal-400">✨ 註冊專屬身分</h2>
        
        <form method="POST">
            {% csrf_token %}
            <div class="space-y-4">
                {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-400 text-xs mt-1">{{ field.errors.as_text }}</p>
                    {% endif %}
                    {% if field.help_text %}
                        <p class="text-slate-500 text-xs mt-1">{{ field.help_text|safe }}</p>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
            
            <button type="submit" class="w-full mt-6 bg-teal-600 hover:bg-teal-500 py-2 rounded-lg font-semibold transition">
                開創世界線 (確認註冊)
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-500">
            已經有帳號了嗎？ <a href="{% url 'login' %}" class="text-teal-400 hover:underline">返回登入酒館</a>
        </div>
    </div>

    <script>
        // 幫 Django 預設的 input 加上美美的 Tailwind 樣式
        document.querySelectorAll('input').forEach(el => {
            el.className = "w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-teal-500";
        });
    </script>
</body>
</html>
